services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: cozycafe
      DB_USER: ${DB_USER:-cozycafe_user}
      DB_PASS: ${DB_PASS:-cozycafe_local_password}
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - uploads_data:/var/www/html/public/uploads

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cozycafe
      MYSQL_USER: ${DB_USER:-cozycafe_user}
      MYSQL_PASSWORD: ${DB_PASS:-cozycafe_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cozycafe_root_local_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/cozycafe.sql:/docker-entrypoint-initdb.d/001-cozycafe.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql_data:
  uploads_data:
